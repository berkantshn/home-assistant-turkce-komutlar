  - {group: isik-oda, text: "yatak odasının ışığını aç", intent: HassTurnOn, slots: {area: Yatak Odası}, setup: {light.abajur: {state: "off"}}, expect: {light.abajur: {state: "on"}}}
  - {group: isik-oda, text: "yatak odasındaki lambayı kapat", intent: HassTurnOff, slots: {area: Yatak Odası}, setup: {light.abajur: {state: "on"}}, expect: {light.abajur: {state: "off"}}}
  - {group: isik-oda, text: "salon ışığını aç", intent: HassTurnOn, slots: {area: Salon}, setup: {light.salon_lambasi: {state: "off"}}, expect: {light.salon_lambasi: {state: "on"}}}
