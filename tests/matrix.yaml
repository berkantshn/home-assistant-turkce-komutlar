  - {group: parlaklik, text: "salonun ışığını yüzde 40'a getir", intent: HassLightSet, slots: {area: Salon, brightness: 40}, setup: {light.salon_lambasi: {state: "on", attrs: {brightness: 255}}}, expect: {light.salon_lambasi: {attrs: {brightness: 102}}}}
  - {group: parlaklik, text: "mutfağın ışığını kıs", intent: HassLightSet, slots: {area: Mutfak, brightness: 30}, setup: {light.mutfak_lambasi: {state: "on", attrs: {brightness: 255}}}, expect: {light.mutfak_lambasi: {attrs: {brightness: 77}}}}
  - {group: parlaklik, text: "ışığı kısar mısın", intent: HassLightSet, device: true, slots: {brightness: 30}, setup: {light.salon_lambasi: {state: "on", attrs: {brightness: 255}}}, expect: {light.salon_lambasi: {attrs: {brightness: 77}}}}
  - {group: parlaklik, text: "avizeyi en yükseğe al", intent: HassLightSet, slots: {name: Avize, brightness: 100}, setup: {light.avize: {state: "on", attrs: {brightness: 10}}}, expect: {light.avize: {attrs: {brightness: 255}}}}
  - {group: parlaklik, text: "parlaklığı yarıya getir", intent: null, note: "yarıya kalıbı <isik_ad> ister; parlaklık sözcüğüyle tek başına tanımsız"}

  - {group: sayi-yazi, text: "avizeyi yüzde elli yap", intent: HassLightSet, slots: {name: Avize, brightness: 50}, setup: {light.avize: {state: "on", attrs: {brightness: 255}}}, expect: {light.avize: {attrs: {brightness: 128}}}}
  - {group: sayi-yazi, text: "salonun sıcaklığını yirmi iki yap", intent: HassClimateSetTemperature, slots: {area: Salon, temperature: 22}, expect: {climate.salon_klimasi: {attrs: {temperature: 22}}}}
  - {group: sayi-yazi, text: "bir saatlik zamanlayıcı kur", intent: HassStartTimer, device: true, slots: {hours: 1}, first: ["tüm zamanlayıcıları iptal et"]}
  - {group: sayi-yazi, text: "salon perdesini yüzde ellisine kadar aç", intent: HassSetPosition, slots: {position: 50}, setup: {cover.salon_perdesi: {state: "closed"}}, expect: {cover.salon_perdesi: {attrs: {current_position: 50}}}}
  - {group: sayi-yazi, text: "beş dakikalık zamanlayıcı kur", intent: HassStartTimer, device: true, slots: {minutes: 5}, first: ["tüm zamanlayıcıları iptal et"]}

