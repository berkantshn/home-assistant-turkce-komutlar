  - {group: iklim, text: "22 buçuk derece yap", intent: HassClimateSetTemperature, device: true, slots: {temperature: 22.5}, expect: {climate.salon_klimasi: {attrs: {temperature: 22.5}}}}
  - {group: iklim, text: "salon kaç derece oldu", intent: HassClimateGetTemperature, slots: {area: Salon}, say: "23"}
  - {group: iklim, text: "salonun sıcaklığı kaç", intent: HassClimateGetTemperature, slots: {area: Salon}, say: "23"}
  - {group: iklim, text: "burası kaç derece", intent: HassClimateGetTemperature, device: true, say: "23"}
  - {group: iklim, text: "evin sıcaklığı kaç", intent: HassClimateGetTemperature, say: "23"}
  - {group: iklim, text: "salonun kliması kapatılsın", intent: HassTurnOff, slots: {area: Salon, domain: climate}, setup: {climate.salon_klimasi: {state: "heat"}}, expect: {climate.salon_klimasi: {state: "off"}}}
  - {group: iklim, text: "klimayı kapat", intent: HassTurnOff, device: true, setup: {climate.salon_klimasi: {state: "heat"}}, expect: {climate.salon_klimasi: {state: "off"}}}
