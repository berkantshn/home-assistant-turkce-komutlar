  - {group: kat-ev, text: "tüm ışıkları kapatır mısın", intent: HassTurnOff, setup: {light.abajur: {state: "on"}, light.mutfak_lambasi: {state: "on"}}, expect: {light.abajur: {state: "off"}, light.mutfak_lambasi: {state: "off"}}}

  # --- G. Parlaklık ---
  - {group: parlaklik, text: "avizeyi yüzde 50 yap", intent: HassLightSet, slots: {name: Avize, brightness: 50}, setup: {light.avize: {state: "on", attrs: {brightness: 255}}}, expect: {light.avize: {attrs: {brightness: 128}}}}
