  - {group: isik-oda, text: "salondaki lambayı yak", intent: HassTurnOn, slots: {area: Salon, domain: light}, setup: {light.salon_lambasi: {state: "off"}}, expect: {light.salon_lambasi: {state: "on"}}}
  - {group: isik-oda, text: "salonun lambasını kapat", intent: HassTurnOff, slots: {area: Salon}, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {state: "off"}}}
  - {group: isik-oda, text: "mutfağın ışığını söndür", intent: HassTurnOff, slots: {area: Mutfak, domain: light}, setup: {light.mutfak_lambasi: {state: "on"}}, expect: {light.mutfak_lambasi: {state: "off"}}}
