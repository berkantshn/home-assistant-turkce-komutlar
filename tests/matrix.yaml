  - {group: renk, text: "salonun ışığını maviye çevir", intent: HassLightSet, slots: {area: Salon, color: blue}, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {attrs: {rgb_color: [0, 0, 255]}}}}
  - {group: renk, text: "ışığı yeşil yak", intent: HassLightSet, device: true, slots: {color: green}, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {attrs: {rgb_color: [0, 128, 0]}}}}
