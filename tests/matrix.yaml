  - {group: durum, text: "mutfağın nemi ne kadar", intent: HassGetState, slots: {area: Mutfak, device_class: humidity}, say: "60"}
  - {group: durum, text: "salon sıcaklık sensörü kaç derece", intent: HassGetState, slots: {name: Salon Sıcaklık Sensörü}, say: "23"}
  - {group: durum, text: "mutfakta hareket var mı", intent: HassGetState, slots: {area: Mutfak, device_class: motion}, say: "Hayır"}
  - {group: durum, text: "televizyon ne durumda", intent: HassGetState, slots: {name: Televizyon}, setup: {media_player.televizyon: {state: "playing"}}, say: "çalıyor"}

  # --- M. Medya ---
  - {group: medya, text: "müziği durdur", intent: HassMediaPause, device: true, setup: {media_player.televizyon: {state: "playing"}}, expect: {media_player.televizyon: {state: paused}}}
  - {group: medya, text: "hoparlörden devam et", intent: HassMediaUnpause, slots: {name: Hoparlör}, setup: {media_player.hoparlor: {state: "paused"}}, expect: {media_player.hoparlor: {state: playing}}}
  - {group: medya, text: "televizyonu duraklat", intent: HassMediaPause, slots: {name: Televizyon}, setup: {media_player.televizyon: {state: "playing"}}, expect: {media_player.televizyon: {state: paused}}}
