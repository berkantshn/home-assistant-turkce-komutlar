  - {group: burada, text: "lambayı söndürür müsün", intent: HassTurnOff, device: true, slots: {domain: light}, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {state: "off"}}}
  - {group: burada, text: "ışıkları kapatır mısın", intent: HassTurnOff, device: true, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {state: "off"}}}
  - {group: burada, text: "ışığı aç", intent: null, note: "uydu yoksa oda bilinmez, hiçbir şey yapmamalı"}

