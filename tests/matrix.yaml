  - {group: durum, text: "hangi ışıklar açık", intent: HassGetState, slots: {domain: light, state: "on"}, setup: {light.salon_lambasi: {state: "on"}, light.avize: {state: "off"}, light.tavan_isigi: {state: "off"}, light.mutfak_lambasi: {state: "off"}, light.abajur: {state: "off"}}, say: "Salon Lambası"}
  - {group: durum, text: "kaç ışık açık", intent: HassGetState, slots: {domain: light, state: "on"}, setup: {light.salon_lambasi: {state: "on"}, light.avize: {state: "off"}, light.tavan_isigi: {state: "off"}, light.mutfak_lambasi: {state: "on"}, light.abajur: {state: "off"}}, say: "2"}
  - {group: durum, text: "bütün ışıklar kapalı mı", intent: HassGetState, slots: {domain: light, state: "off"}, setup: {light.salon_lambasi: {state: "off"}, light.avize: {state: "off"}, light.tavan_isigi: {state: "off"}, light.mutfak_lambasi: {state: "off"}, light.abajur: {state: "off"}}, say: "Evet"}
  - {group: durum, text: "salon perdesi açık mı", intent: HassGetState, slots: {name: Salon Perdesi, state: open}, setup: {cover.salon_perdesi: {state: "open"}}, say: "Evet"}
  - {group: durum, text: "salon penceresi açık mı", intent: HassGetState, slots: {name: Salon Penceresi, state: "on"}, say: "Hayır"}
  - {group: durum, text: "ön kapı kilitli mi", intent: HassGetState, slots: {name: Ön Kapı, state: locked}, setup: {lock.on_kapi: {state: "locked"}}, say: "Evet", expect: {lock.on_kapi: {state: locked}}}
  - {group: durum, text: "salon nem sensörü kaç", intent: HassGetState, slots: {name: Salon Nem Sensörü}, say: "45"}
