  # --- I. Sıcaklık ---
  - {group: iklim, text: "salonun sıcaklığını 22 yap", intent: HassClimateSetTemperature, slots: {area: Salon, temperature: 22}, expect: {climate.salon_klimasi: {attrs: {temperature: 22}}}}
