  - {group: rica, text: "salondaki lambaları kapatsana", intent: HassTurnOff, slots: {area: Salon}, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {state: "off"}}}
  - {group: rica, text: "yatak odasının ışığını söndürür müsün", intent: HassTurnOff, slots: {area: Yatak Odası}, setup: {light.abajur: {state: "on"}}, expect: {light.abajur: {state: "off"}}}
