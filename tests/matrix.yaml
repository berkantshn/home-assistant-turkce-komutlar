  # --- L. Durum sorguları ---
  - {group: durum, text: "avize açık mı", intent: HassGetState, slots: {name: Avize, state: "on"}, setup: {light.avize: {state: "on"}}, say: "Evet"}
  - {group: durum, text: "avize kapalı mı", intent: HassGetState, slots: {name: Avize, state: "off"}, setup: {light.avize: {state: "on"}}, say: "Hayır"}
