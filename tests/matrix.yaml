  # --- J. Fan ---
  - {group: fan, text: "tavan fanını yüzde 40 yap", intent: HassFanSetSpeed, slots: {name: Tavan Fanı, percentage: 40}, setup: {fan.tavan_fani: {state: "on"}}, expect: {fan.tavan_fani: {attrs: {percentage: 40}}}}
