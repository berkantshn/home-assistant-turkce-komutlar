  - {group: rica, text: "kahve makinesini çalıştırır mısın", intent: HassTurnOn, slots: {name: Kahve Makinesi}, setup: {switch.kahve_makinesi: {state: "off"}}, expect: {switch.kahve_makinesi: {state: "on"}}}
  - {group: rica, text: "avize yansın", intent: HassTurnOn, slots: {name: Avize}, setup: {light.avize: {state: "off"}}, expect: {light.avize: {state: "on"}}}
  - {group: rica, text: "yatak odasında ışık kalmasın", intent: HassTurnOff, slots: {area: Yatak Odası}, setup: {light.abajur: {state: "on"}}, expect: {light.abajur: {state: "off"}}}
  - {group: rica, text: "Avizeyi açar mısın?", intent: HassTurnOn, slots: {name: Avize}, setup: {light.avize: {state: "off"}}, expect: {light.avize: {state: "on"}}}

  # --- C. Ada göre iyelik: "salonun avizesini" ---
  - {group: iyelik, text: "salonun avizesini aç", intent: HassTurnOn, slots: {area: Salon, name: Avize}, setup: {light.avize: {state: "off"}}, expect: {light.avize: {state: "on"}}}
  - {group: iyelik, text: "yatak odasının abajurunu kapat", intent: HassTurnOff, slots: {area: Yatak Odası, name: Abajur}, setup: {light.abajur: {state: "on"}}, expect: {light.abajur: {state: "off"}}}
  - {group: iyelik, text: "yatak odasındaki tavan fanını aç", intent: HassTurnOn, slots: {name: Tavan Fanı}, setup: {fan.tavan_fani: {state: "off"}}, expect: {fan.tavan_fani: {state: "on"}}}
  - {group: iyelik, text: "salonun prizini kapat", intent: HassTurnOff, slots: {area: Salon}, setup: {switch.priz: {state: "on"}}, expect: {switch.priz: {state: "off"}}}

  # --- D. Büyük I sorunu: konuşma tanıma cümleye büyük harfle başlar ---
  - {group: buyuk-i, text: "Işıkları kapat", intent: HassTurnOff, device: true, slots: {domain: light}, setup: {light.salon_lambasi: {state: "on"}}, expect: {light.salon_lambasi: {state: "off"}}}
  - {group: buyuk-i, text: "Işığı aç", intent: HassTurnOn, device: true, slots: {domain: light}, setup: {light.salon_lambasi: {state: "off"}}, expect: {light.salon_lambasi: {state: "on"}}}
  - {group: buyuk-i, text: "tavan ışığını aç", intent: HassTurnOn, note: "küçük harfli takma adla çalışır", setup: {light.tavan_isigi: {state: "off"}}, expect: {light.tavan_isigi: {state: "on"}}}
  - {group: buyuk-i, text: "ara ışığını aç", intent: null, note: "BİLİNEN SINIR: ad büyük I ile yazılmış, takma ad yok", setup: {light.ara_isigi: {state: "off"}}, expect: {light.ara_isigi: {state: "off"}}}
  - {group: buyuk-i, text: "Ara Işığını aç", intent: HassTurnOn, note: "metin de büyük I ile gelirse eşleşir", setup: {light.ara_isigi: {state: "off"}}, expect: {light.ara_isigi: {state: "on"}}}

  - {group: buyuk-i, text: "ikinci lambayı aç", intent: HassTurnOn, note: "büyük İ ile yazılmış ad, küçük i ile eşleşir", setup: {light.ikinci_lamba: {state: "off"}}, expect: {light.ikinci_lamba: {state: "on"}}}
  - {group: buyuk-i, text: "Salonun ışığını aç.", intent: HassTurnOn, slots: {area: Salon}, setup: {light.salon_lambasi: {state: "off"}}, expect: {light.salon_lambasi: {state: "on"}}}
  - {group: buyuk-i, text: "Isıyı 21 yap", intent: HassClimateSetTemperature, device: true, slots: {temperature: 21}, expect: {climate.salon_klimasi: {attrs: {temperature: 21}}}}
  - {group: buyuk-i, text: "İptal et", intent: HassNevermind}
  - {group: buyuk-i, text: "Lütfen mutfağın ışığını aç.", intent: HassTurnOn, slots: {area: Mutfak}, setup: {light.mutfak_lambasi: {state: "off"}}, expect: {light.mutfak_lambasi: {state: "on"}}}

  # --- E. Bulunduğun oda (uydu cihazı) ---
