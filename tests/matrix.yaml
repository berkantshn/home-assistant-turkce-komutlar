# Made By FALCREB
# Test matrisi. Her satır bir cümle, beklenen niyet (intent), beklenen slotlar ve
# sonuçta sahte cihazda görülmesi gereken durum. intent: null = eşleşmemeli.
# device: true = konuşma, Salon'daki sahte uydu cihazından geliyormuş gibi.
cases:
  # --- A. Tekil ve iyelikli ışık: Türkçe ek işleme ---
